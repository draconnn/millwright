# Models offered in the menu bar's per-project "Model" submenu — one per line:
#   <engine>:<model-id>  [label]
#
# <engine> selects which CLI runs the phase:
#   codex   -> `codex exec`  (OpenAI models only)
#   claude  -> `claude -p`   (Anthropic models only)
# The label is what the menu shows; it defaults to the whole <engine>:<model-id>.
#
# Picking an entry writes <repo>/logs/pipeline/MODEL. The daemon re-reads that
# file at the start of every phase, so switching takes effect on the next phase
# with no restart. Deleting the file falls back to `codex exec` on whatever
# ~/.codex/config.toml defaults to.
#
# Only ids listed here can be selected — bin/set-model.sh refuses anything else,
# because the value chooses which binary the daemon executes.

codex:gpt-5.5           GPT-5.5
codex:gpt-5.6-sol       GPT-5.6 Sol
claude:claude-opus-5    Claude Opus 5
claude:claude-opus-4-8  Claude Opus 4.8
claude:claude-sonnet-5  Claude Sonnet 5
